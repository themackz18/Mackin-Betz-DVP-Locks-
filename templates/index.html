<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mackin Betz • DVP Locks</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --card: #141414;
            --text: #f1f1f1;
            --gold: #ffd700;
            --accent: #c026d3;
            --border: #333;
        }
        body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; margin: 0; padding: 0; }
        header { background: linear-gradient(90deg, #1a0033, #330066); padding: 25px 20px; text-align: center; position: relative; }
        h1 { margin: 0; color: var(--gold); font-size: 2.4rem; letter-spacing: 3px; }
        .flame-canvas { position: absolute; top: 15px; right: 20px; width: 90px; height: 90px; }
        .tabs { display: flex; overflow-x: auto; background: #111; position: sticky; top: 0; z-index: 10; border-bottom: 1px solid var(--border); }
        .tab { padding: 16px 22px; cursor: pointer; white-space: nowrap; font-weight: 500; }
        .tab.active { background: var(--accent); color: white; }
        .content { padding: 20px; }
        .player-row { display: flex; align-items: center; background: var(--card); margin-bottom: 12px; border-radius: 12px; padding: 14px; border: 1px solid var(--border); }
        .confidence { background: #22c55e; color: #000; padding: 4px 12px; border-radius: 9999px; font-size: 0.85rem; font-weight: bold; }
        .pick-pill { padding: 4px 14px; border-radius: 9999px; font-size: 0.85rem; font-weight: bold; }
        .export-btn { background: #ffd700; color: #000; border: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; cursor: pointer; margin: 15px 0; }
        .export-btn:hover { background: #ffed4e; }
        .cheatsheet-tab img { max-width: 100%; border-radius: 16px; border: 3px solid var(--gold); box-shadow: 0 10px 30px rgba(192, 38, 211, 0.4); }
    </style>
</head>
<body>
    <header>
        <canvas id="flame" class="flame-canvas"></canvas>
        <h1>MACKIN BETZ</h1>
        <p style="margin: 8px 0 0; opacity: 0.9;">DVP Locks • NBA Props</p>
        <button onclick="exportReport()" class="export-btn">📤 Export Report (JSON)</button>
    </header>

    <div class="tabs" id="tabs">
        <div class="tab active" data-pane="p4s">Today's P4s</div>
        <div class="tab" data-pane="slips">Slips</div>
        <div class="tab" data-pane="leaders">Leaders</div>
        <div class="tab" data-pane="locks">Top Locks</div>
        <div class="tab" data-pane="value">Value Plays</div>
        <div class="tab" data-pane="unders">+EV Unders</div>
        <div class="tab" data-pane="builder">Slip Builder</div>
        <div class="tab" data-pane="cheatsheet">Cheatsheet</div>
    </div>

    <div class="content" id="pane-content"></div>

    <script>
        let reportData = {};

        // Flame / smoke logo animation (your old style - glowing yellow/orange particles)
        const canvas = document.getElementById('flame');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function createParticle() {
            return { x: canvas.width/2 + (Math.random()*20-10), y: canvas.height - 10, size: Math.random()*7 + 5, speed: Math.random()*3.5 + 2.5, opacity: 1, hue: 30 + Math.random()*40 };
        }
        function animateFlame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (Math.random() < 0.7) particles.push(createParticle());
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.y -= p.speed;
                p.opacity -= 0.028;
                p.size *= 0.985;
                ctx.fillStyle = `hsla(${p.hue}, 100%, 65%, ${p.opacity})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                if (p.opacity <= 0) particles.splice(i, 1);
            }
            requestAnimationFrame(animateFlame);
        }
        canvas.width = 90; canvas.height = 90;
        animateFlame();

        async function loadReport() {
            try {
                const res = await fetch('/api/report');
                reportData = await res.json();
                renderCurrentPane('p4s');
            } catch (e) {
                console.error("Failed to load report", e);
            }
        }

        function setupTabs() {
            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    renderCurrentPane(tab.getAttribute('data-pane'));
                });
            });
        }

        function renderCurrentPane(pane) {
            const content = document.getElementById('pane-content');
            content.innerHTML = '';

            if (pane === 'cheatsheet') {
                content.innerHTML = `
                    <div style="text-align: center; padding: 20px 10px;">
                        <h2 style="color: var(--gold);">📊 Mackin Cheatsheet</h2>
                        <img src="/data/mackin_cheatsheet.png" alt="Mackin Cheatsheet" class="cheatsheet-tab" style="margin: 20px 0;">
                        <p style="opacity: 0.8;">Generated: ${reportData.generated_at || 'Just now'}</p>
                    </div>
                `;
                return;
            }

            // Your original panes render here (P4s, Leaders, etc.)
            // Replace the line below with your original rendering code if needed
            content.innerHTML = `<div style="text-align:center; padding:40px; color:#94a3b8;">${pane} content loaded from reportData</div>`;
        }

        function exportReport() {
            if (!reportData || Object.keys(reportData).length === 0) {
                alert("Refresh the report first.");
                return;
            }
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(reportData, null, 2));
            const a = document.createElement('a');
            a.href = dataStr;
            a.download = "mackin_report.json";
            document.body.appendChild(a);
            a.click();
            a.remove();
        }

        window.onload = () => {
            setupTabs();
            loadReport();
        };

        // Optional auto-refresh
        setInterval(loadReport, 300000);
    </script>
</body>
</html>
