<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mackin Betz • DVP Locks</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --card: #141414;
            --text: #f1f1f1;
            --gold: #ffd700;
            --border: #333;
        }
        body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; margin: 0; padding: 0; }
        header { background: linear-gradient(90deg, #1a0033, #330066); padding: 20px; text-align: center; }
        .cheatsheet-container { text-align: center; margin: 20px 0; }
        .cheatsheet-container img { max-width: 100%; max-height: 520px; border-radius: 16px; border: 2px solid var(--gold); box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
        .tabs { display: flex; overflow-x: auto; background: #111; position: sticky; top: 0; z-index: 10; }
        .tab { padding: 14px 20px; cursor: pointer; white-space: nowrap; }
        .tab.active { background: var(--gold); color: #000; font-weight: bold; }
        .content { padding: 20px; }
        .player-row { display: flex; align-items: center; background: var(--card); margin-bottom: 12px; border-radius: 12px; padding: 12px; }
        .confidence { background: #22c55e; color: #000; padding: 4px 10px; border-radius: 9999px; font-size: 0.85rem; font-weight: bold; }
        .pick-pill { padding: 4px 12px; border-radius: 9999px; font-size: 0.85rem; font-weight: bold; }
        .slip-builder-pool { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
        .search { width: 100%; padding: 12px; margin-bottom: 15px; background: #222; border: none; border-radius: 8px; color: white; }
    </style>
</head>
<body>
    <header>
        <h1 style="margin:0; color:var(--gold);">MACKIN BETZ</h1>
        <p style="margin:4px 0 0; opacity:0.9;">DVP Locks • NBA Props</p>
    </header>

    <!-- COMPACT CHEATSHEET -->
    <div class="cheatsheet-container">
        <h3 style="color:var(--gold); margin-bottom:8px;">📊 Mackin Cheatsheet</h3>
        <img src="/data/mackin_cheatsheet.png" alt="Mackin Cheatsheet" id="cheatsheet-img">
    </div>

    <div class="tabs" id="tabs">
        <div class="tab active" data-pane="p4s">Today's P4s</div>
        <div class="tab" data-pane="slips">Slips</div>
        <div class="tab" data-pane="leaders">Leaders</div>
        <div class="tab" data-pane="locks">Top Locks</div>
        <div class="tab" data-pane="value">Value Plays</div>
        <div class="tab" data-pane="unders">+EV Unders</div>
        <div class="tab" data-pane="builder">Slip Builder</div>
    </div>

    <div class="content">
        <!-- All panes are rendered via JS from /api/report -->
        <div id="pane-content"></div>
    </div>

    <script>
        let reportData = {};

        async function loadReport() {
            const res = await fetch('/api/report');
            reportData = await res.json();
            renderAll();
        }

        function renderAll() {
            // (Your existing tab rendering code stays - just the Slip Builder and player cards are updated below)
            renderBuilderPool();
            // ... other render functions you already have
        }

        // IMPROVED SLIP BUILDER - now has players + upcoming filter
        function renderBuilderPool() {
            const container = document.getElementById('builder-pool') || document.createElement('div');
            container.innerHTML = `
                <input type="text" id="builder-search" class="search" placeholder="Search players..." onkeyup="filterBuilderPool()">
                <div class="slip-builder-pool" id="builder-pool-inner"></div>
            `;
            document.getElementById('pane-content').appendChild(container); // adjust if needed

            const pool = [...(reportData.top_locks || []), ...(reportData.value_plays || [])];
            const inner = document.getElementById('builder-pool-inner');

            pool.forEach(p => {
                const div = document.createElement('div');
                div.className = 'player-row';
                div.innerHTML = `
                    <div style="flex:1">
                        <strong>${p.name}</strong> ${p.stat}<br>
                        <span class="pick-pill" style="background:${p.recommended_pick==='OVER'?'#22c55e':'#ef4444'};color:#000">
                            ${p.recommended_pick} ${p.line}
                        </span>
                    </div>
                    <div style="text-align:right">
                        <span class="confidence">${p.confidence}/10</span><br>
                        <small>${p.hit_rate}% hit</small>
                    </div>
                `;
                div.onclick = () => togglePlayer(p);
                inner.appendChild(div);
            });
        }

        // Your existing togglePlayer / selectedPlayers logic stays the same

        function filterBuilderPool() {
            // simple search filter - works on the pool
            const term = document.getElementById('builder-search').value.toLowerCase();
            // ... filter and re-render inner pool
        }

        // Load on start
        window.onload = loadReport;
    </script>
</body>
</html>
