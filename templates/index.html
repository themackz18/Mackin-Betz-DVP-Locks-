<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mackin Betz • DVP Locks</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --card: #1a1a2e;
            --text: #f1f1f1;
            --gold: #ffd700;
            --accent: #c026d3;
            --border: #333;
        }
        body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; margin: 0; padding: 0; }
        header { background: linear-gradient(90deg, #1a0033, #330066); padding: 25px 20px; text-align: center; position: relative; }
        h1 { margin: 0; color: var(--gold); font-size: 2.4rem; letter-spacing: 3px; }
        .flame-canvas { position: absolute; top: 15px; right: 20px; width: 90px; height: 90px; }
        .tabs { display: flex; overflow-x: auto; background: #111; position: sticky; top: 0; z-index: 10; border-bottom: 1px solid var(--border); }
        .tab { padding: 16px 22px; cursor: pointer; white-space: nowrap; font-weight: 500; color: #aaa; }
        .tab.active { color: var(--gold); border-bottom: 3px solid var(--gold); }
        .content { padding: 20px; }
        .player-row { display: flex; align-items: center; background: var(--card); margin-bottom: 12px; border-radius: 12px; padding: 14px; border: 1px solid var(--border); }
        .confidence { background: #22c55e; color: #000; padding: 4px 12px; border-radius: 9999px; font-size: 0.85rem; font-weight: bold; }
        .pick-pill { padding: 4px 14px; border-radius: 9999px; font-size: 0.85rem; font-weight: bold; }
        .export-btn { background: #ffd700; color: #000; border: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; cursor: pointer; margin: 15px 0; }
        .export-btn:hover { background: #ffed4e; }
        .cheatsheet-tab img { max-width: 100%; border-radius: 16px; border: 3px solid var(--gold); box-shadow: 0 10px 30px rgba(192, 38, 211, 0.4); }
    </style>
</head>
<body>
    <header>
        <canvas id="flame" class="flame-canvas"></canvas>
        <h1>MACKIN BETZ</h1>
        <p style="margin: 8px 0 0; opacity: 0.9;">DVP Locks • NBA Props</p>
        <button onclick="exportReport()" class="export-btn">📤 Export Report (JSON)</button>
    </header>

    <div class="tabs" id="tabs">
        <div class="tab" data-pane="p4s">TODAY'S P4S</div>
        <div class="tab active" data-pane="slips">SLIPS</div>
        <div class="tab" data-pane="leaders">LEADERS</div>
        <div class="tab" data-pane="locks">TOP LOCKS</div>
        <div class="tab" data-pane="value">VALUE PLAYS</div>
        <div class="tab" data-pane="unders">UNDERS</div>
        <div class="tab" data-pane="builder">BUILDER</div>
        <div class="tab" data-pane="cheatsheet">CHEATSHEET</div>
    </div>

    <div class="content" id="pane-content"></div>

    <script>
        let reportData = {};

        // Flame/smoke logo animation (your old glowing style)
        const canvas = document.getElementById('flame');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function createParticle() {
            return { x: canvas.width/2 + (Math.random()*20-10), y: canvas.height - 10, size: Math.random()*8 + 5, speed: Math.random()*3.5 + 2.5, opacity: 1, hue: 30 + Math.random()*40 };
        }
        function animateFlame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (Math.random() < 0.7) particles.push(createParticle());
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.y -= p.speed;
                p.opacity -= 0.028;
                p.size *= 0.985;
                ctx.fillStyle = `hsla(${p.hue}, 100%, 65%, ${p.opacity})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                if (p.opacity <= 0) particles.splice(i, 1);
            }
            requestAnimationFrame(animateFlame);
        }
        canvas.width = 90; canvas.height = 90;
        animateFlame();

        async function loadReport() {
            try {
                const res = await fetch('/api/report');
                reportData = await res.json();
                renderCurrentPane('slips');  // default to SLIPS tab like your screenshot
            } catch (e) {
                console.error("Failed to load report", e);
            }
        }

        function setupTabs() {
            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    renderCurrentPane(tab.getAttribute('data-pane'));
                });
            });
        }

        function renderCurrentPane(pane) {
            const content = document.getElementById('pane-content');
            content.innerHTML = '';

            if (pane === 'cheatsheet') {
                content.innerHTML = `
                    <div style="text-align: center; padding: 20px 10px;">
                        <h2 style="color: var(--gold);">📊 Mackin Cheatsheet</h2>
                        <img src="/data/mackin_cheatsheet.png" alt="Mackin Cheatsheet" class="cheatsheet-tab" style="margin: 20px 0;">
                        <p style="opacity: 0.8;">Generated: ${reportData.generated_at || 'Just now'}</p>
                    </div>
                `;
                return;
            }

            // Your original SLIPS / RECOMMENDED SLIPS rendering (matching your screenshot)
            if (pane === 'slips') {
                let html = `<h2 style="color: var(--gold);">RECOMMENDED SLIPS</h2>`;
                if (reportData.slips && reportData.slips["2"]) {
                    html += `<h3 style="color: #a855f7;">2-LEG SLIPS</h3>`;
                    reportData.slips["2"].forEach(slip => {
                        html += `
                            <div style="background: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 16px;">
                                <div style="margin-bottom: 12px;">Total Proj: <strong>${slip.total_proj}</strong> • Target: <strong>PRA</strong></div>
                                ${slip.players.map(player => `
                                    <div style="background: #1f2937; border-radius: 10px; padding: 12px; margin-bottom: 10px; display: flex; justify-content: space-between;">
                                        <div>
                                            <strong>Player</strong><br>
                                            <span style="background: #8b5cf6; color: white; padding: 2px 8px; border-radius: 9999px; font-size: 0.8rem;">PRA</span>
                                        </div>
                                        <div style="text-align: right;">
                                            DVP 0<br>
                                            Proj N/A
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        `;
                    });
                }
                content.innerHTML = html;
                return;
            }

            // Placeholder for other tabs (add your original code here if needed)
            content.innerHTML = `<div style="text-align:center; padding:60px; color:#94a3b8;">${pane} tab content (your original rendering goes here)</div>`;
        }

        function exportReport() {
            if (!reportData || Object.keys(reportData).length === 0) {
                alert("Refresh the report first.");
                return;
            }
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(reportData, null, 2));
            const a = document.createElement('a');
            a.href = dataStr;
            a.download = "mackin_report.json";
            document.body.appendChild(a);
            a.click();
            a.remove();
        }

        window.onload = () => {
            setupTabs();
            loadReport();
        };
    </script>
</body>
</html>
