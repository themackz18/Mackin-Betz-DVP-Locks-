<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mackin Betz DVP Locks</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --black:    #05040a;
            --deep:     #0c0a14;
            --card:     #1a1728;
            --border:   #2a2444;
            --purple:   #7c3aed;
            --purple2:  #9d5cf6;
            --gold:     #f5c518;
            --gold2:    #ffd966;
            --green:    #10b981;
            --text:     #e8e0f8;
            --muted:    #6b6485;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Barlow', sans-serif;
            background: var(--black);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse 80% 40% at 50% 0%, rgba(124,58,237,0.18) 0%, transparent 70%),
                        radial-gradient(ellipse 60% 30% at 20% 100%, rgba(245,197,24,0.07) 0%, transparent 60%);
            z-index: 0;
            pointer-events: none;
        }

        header {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 32px 16px 24px;
            border-bottom: 1px solid var(--border);
        }

        .logo-wrap { position: relative; display: inline-block; margin-bottom: 8px; }

        #flameCanvas {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: -12px;
            width: 360px;
            height: 130px;
            pointer-events: none;
            z-index: 1;
        }

        .logo-text {
            font-family: 'Cinzel Decorative', serif;
            font-size: clamp(1.9rem, 6vw, 3rem);
            font-weight: 900;
            letter-spacing: 3px;
            background: linear-gradient(135deg, #f5c518 0%, #ffd966 45%, #9d5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-sub {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 0.78rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--muted);
        }

        .updated {
            margin-top: 10px;
            font-size: 0.75rem;
            color: var(--muted);
        }

        .tabs {
            display: flex;
            background: var(--deep);
            border-bottom: 1px solid var(--border);
            overflow-x: auto;
            padding: 0 4px;
        }

        .tab {
            flex: 1;
            padding: 16px 8px 12px;
            text-align: center;
            cursor: pointer;
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 700;
            font-size: 0.82rem;
            text-transform: uppercase;
            color: var(--muted);
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
        }

        .tab.active {
            color: var(--gold);
            border-bottom-color: var(--gold);
        }
